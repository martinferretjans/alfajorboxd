<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alfajorboxd</title>
    <style>
        body {
            background-color: #f5f0e6;
            color: #3b2f2f;
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h1 {
            color: #8b5e3c;
        }
    </style>
</head>
<body>
    <h1>Alfajorboxd</h1>
    <p>
        Alfajorboxd es una aplicación web para buscar alfajores, calificarlos y
        llevar un registro de los ya probados. De cada alfajor se guardará:
    </p>
    <ul>
        <li>Marca</li>
        <li>Relleno</li>
        <li>Cantidad de tapas</li>
        <li>Cobertura (blanco o negro)</li>
        <li>Precio</li>
        <li>Calificación</li>
    </ul>
</body>
</html>
